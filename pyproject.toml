[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aic"
version = "0.1.0"
description = "AI Coding Workflow CLI"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "pyperclip>=1.9",
    "prompt_toolkit>=3.0",
]

[project.scripts]
aic = "cli.main:main"

[tool.setuptools.packages.find]
include = ["cli*"]
