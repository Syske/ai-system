version: 1
locale: zh

# 向导菜单配置（配置驱动，维护说明见 OPERATIONS.md §1.10）。
# - 本文件只存结构 + key；用户可见文案（分区标题/字段备注/选项描述）在 config/i18n/{locale}.yaml。
# - 新增命令：写 cli/commands/aic-<name>.md，再在本文件 sections 加条目、command_fields 加字段。
# - 新增工作流：先在 config/workflow-registry.yaml 注册，再在 sections 加条目。
# - 分组/顺序/emoji：调整 sections；已发现但未注册的条目自动落入 "其他流程/其他命令"。
# - 国际化：复制 config/i18n/zh.yaml 为 <lang>.yaml，并把 locale 改为 <lang>。

# 目标选择菜单：分区与条目。
# kind: workflow（注册于 workflow-registry.yaml）或 command（cli/commands/*.md）。
# title 为 i18n key（解析见 config/i18n/{locale}.yaml）。
# flow_main 的编号仅表达主链展示顺序；主链拓扑（谁接谁）以 workflows/README.md 为唯一来源。

# AI 内部工作流：不在用户菜单显示（不落“其他流程”），由 AI 按需触发
# （ADR-0009: AI 运维优先）。已注册但隐藏 = AI 可调用、用户菜单不可见。
hidden_workflows:
  - bootstrap      # 环境首启/缺失时 AI 触发（状态驱动）
  - analysis       # maintain 内部环节（系统健康）
  - knowledge      # maintain 内部环节（知识生命周期）

# AI 内部命令：不在用户菜单显示（不落“其他命令”），由 AI 按需触发
# （ADR-0009: AI 主导变更生命周期）。已注册但隐藏 = AI 可调用、用户菜单不可见。
hidden_commands:
  - propose       # 变更集创建（spec 环节 CLI 触发器, AI 在 prepare/spec 时调用）
  - apply         # 实现变更任务（develop 环节 CLI 触发器, AI 实现时调用）
  - archive       # 归档变更集（release 后 AI 自动归档）
  - explore       # 构思入口（AI 推荐流程时按需触发, 用户无需选命令）

sections:
  - title: flow_main
    items:
      - name: prepare
        kind: workflow
        icon: "🧰 "
        number: 1
      - name: spec
        kind: workflow
        icon: "📐 "
        number: 2
      - name: dev-setup
        kind: workflow
        icon: "🛠️ "
        number: 3
      - name: develop
        kind: workflow
        icon: "🔨 "
        number: 4
      - name: review
        kind: workflow
        icon: "🔍 "
        number: 5
      - name: verify
        kind: workflow
        icon: "🧪 "
        number: 6
      - name: release
        kind: workflow
        icon: "🚀 "
        number: 7
  - title: flow_fix
    items:
      - name: bugfix
        kind: workflow
        icon: "🐛 "
      - name: hotfix-test-doc
        kind: workflow
        icon: "📋 "
  - title: flow_analysis
    items:
      - name: code-review
        kind: workflow
        icon: "🔎 "
      - name: change-impact
        kind: workflow
        icon: "🧨 "
  - title: commands_changes
    items:
      - name: proposal
        kind: workflow
        icon: "💡 "
  - title: commands_analysis
    items:
      - name: scan
        kind: command
        icon: "🔎 "
      - name: trace
        kind: command
        icon: "🧵 "
  - title: commands_skills
    items:
      - name: skill
        kind: command
        icon: "🚀 "
      - name: skill-source
        kind: command
        icon: "🌐 "
  - title: commands_maintenance
    items:
      - name: maintain
        kind: command
        icon: "🧹 "
      - name: workflow
        kind: command
        icon: "🧩 "
      - name: command
        kind: command
        icon: "📝 "
      - name: pack
        kind: command
        icon: "📦 "
      - name: extensions-init
        kind: command
        icon: "🧰 "

# 各命令的字段定义（[[字段名, 是否必填], ...]）；未注册的命令用 default。
