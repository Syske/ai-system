# Maintenance state (system-level, committed).
#
# Travels with ai-system in git so any machine/CI can see when the system
# was last maintained and what was found (cross-machine continuity).
#
# Scope: SYSTEM-LEVEL ONLY (metrics / tool gates / proposals / fixes).
# Machine / environment observations go to the per-run diagnostic log
# (logs/, gitignored), NOT here. Triage rule + trigger keywords live in
# cli/commands/aic-maintain.md (Outputs / state-update section).
#
# Write path (AI-manual): read next_maintenance at session start (ADR-0009);
# write last_run / mode / next_maintenance / last_findings at run end.
#
# last_findings is a block sequence of multi-line PLAIN scalars — three characters
# terminate a scalar early and break the file (validated by tools/checks/config_yaml.py):
#   1. a line starting with `- ` (starts a new list item)
#   2. the ASCII sequence `: ` (parsed as a nested mapping)
#   3. the ASCII sequence ` #` (starts a comment; e.g. `format-check #23` — use「第 23 项」)
# After editing, always self-check with: python3 -c "import yaml;yaml.safe_load(open('config/maintenance.yaml'))"

