version: 1

# 开发主链各阶段可用的可选外部技能。
#
# - 默认全空（无外部能力）；追加条目即可扩展，置空即关闭。
# - 每条：skill 名 / path / desc（提示语，供 runtime 知晓何时用）/ enabled（默认 true）。
# - prompt_builder 在构建主链工作流 prompt 时，把该阶段已启用的外部能力作为「可选外部能力」
#   附注注入，运行时/agent 按需加载（如 prepare 用 confluence-markdown-publisher 摄取内网 wiki 需求）。
# - 与 config/chains.yaml（积木链路）、config/skill-groups.yaml core_skills 互补：本注册表
#   面向「开发主链各阶段」的可选能力，链与分组面向任意任务组合/技能启动。
#
# > TRIAL(临时)：wayfinder 为主链 prepare/spec/develop 的**临时外部能力**（item7），便于评估
# > 其决策图方法论。触发条件：检测到「大块模糊构想 / 迷雾 / 路线未知 / 远超单会话」时才前置
# > 生成 .wayfinder/ 决策图；非此场景勿用，不改变常规主链行为。评估后定去留
# > （直接吸收 / 派生扩展 / 移除），对应 core_skills 里 wayfinder 的临时登记。

capabilities:
  prepare:
    - skill: confluence-markdown-publisher
      path: extensions/confluence-markdown-publisher
      desc: Fetch intranet wiki requirement documents (e.g. pageId pages, tr3/tr4 product/architecture designs)
      enabled: true
    - skill: wayfinder
      path: skills/wayfinder
      desc: "[TRIAL] Vague large-scale idea/fog → generate .wayfinder/ decision map before spec; skip outside this scenario"
      enabled: true
  spec:
    - skill: wayfinder
      path: skills/wayfinder
      desc: "[TRIAL] Requirements still vague → clarify design route with a decision ticket; optional"
      enabled: true
    - skill: tr5
      path: extensions/tr5
      desc: "Backend TR5 one-pager design (mid-platform context + enhanced coolSpec quality gate): TR3/TR4 + iteration-page ID entry, forward-pipeline generation & publish; skip for non-backend-TR5 scenarios"
      enabled: true
  dev-setup: []
  develop:
    - skill: wayfinder
      path: skills/wayfinder
      desc: "[TRIAL] Align boundaries with a .wayfinder/ decision map before large changes; optional"
      enabled: true
  review: []
  verify: []
  release: []
