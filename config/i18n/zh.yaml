version: 1

# 用户可见文案（按 key 引用，config/menu.yaml 存 key）。
# 国际化：复制本文件为 <lang>.yaml（如 en.yaml），并在 config/menu.yaml 的 locale 指定语言。
sections:
  flow_main: "开发主链"
  flow_fix: "修复流程"
  flow_capability: "系统能力"
  flow_analysis: "代码分析"
  commands_changes: "变更管理"
  commands_analysis: "代码检索"
  commands_skills: "技能管理"
  commands_maintenance: "系统维护"
  flow_other: "其他流程"
  commands_other: "其他命令"
  skill_group_company: "公司技能"
  skill_group_global: "全局技能"
  skill_group_hotfix: "常用组合"
  skill_group_project: "项目技能"
  skill_group_other: "其他技能"
  task_combos: "常用任务"

field_notes:
  "Project ID": "from workspaces/"
  "Workspace ID": "from workspaces/"
  "Change ID": "from openspec/changes/"
  "Task ID": "from openspec/changes/*/tasks/cards/"
  "Mode": "re-entry = L3 change (prepare/spec); weekly/monthly/quarterly/on-demand = maintain; standard/hotfix = bugfix"
  "Operation": "search=梳理检索 diff=逻辑对比 chain=逻辑链路 manual=手动自定义（影响评估请用 change-impact 工作流）"
  "Workspace": "选择 workspaces/ 下工作区；skip=不在workspace中搜索"
  "Projects": "选择 projects/ 下代码仓库（多选，空格切换）；skip=在所有项目中梳理"
  "Branch": "选择代码分支（支持输入过滤）；不选默认 master"
  "Code Reference": "关键词（逗号分隔）/代码块；manual 时填自由分析指令"
  "Compare With": "仅 diff：第二段待对比代码"
  "Keep Results": "yes=结果保留到 scans/ 目录；no=仅会话内输出"
  "Knowledge Operation": "collect=收集沉淀 update=更新 search=检索 review=审核去重 archive=归档过时"
  "Knowledge Scope": "知识分类范围（AI System / Engineering / Project）"
  "Analysis Target": "分析 ai-system 自身；与 maintain（例行巡检）、scan（代码梳理）区分"
  "Analysis Scope": "限定分析范围；留空=全量"
  "Branch Mapping": "项目→分支映射，格式 project-a:branch-x, project-b:branch-y；未指定的项目默认用 Base Branch"
  "Review Focus": "审查关注点（如性能、安全、特定模块）；留空=全面审查"
  "Topic": "优化主题或待讨论的临时想法"
  "Related Materials": "关联材料（文档、链接、背景信息）"
  "Base Branch": "基线分支；默认 master"
  "Bug Description": "bug 现象与复现描述"
  "Change Request": "变更需求描述或变更点"
  "Environment": "环境名称（默认 local）"
  "Environment (default: local)": "环境名称（默认 local）"
  "Existing Design": "已有设计文档"
  "Existing Reports": "已有分析报告"
  "Existing Specifications": "已有规格"
  "Issue ID": "问题单号"
  "Logs": "日志/片段；manual bug 分析时填写待分析日志"
  "Output Directory": "输出目录（默认 ../ai-system-pack）"
  "Related Issue": "关联问题"
  "Related Issues": "关联问题列表"
  "Release Version": "发布版本号"
  "Requirement Documents": "需求文档"
  "Scope": "限定范围"
  "Source": "知识来源"
  "Specification Reference": "规格引用"
  "Stack Trace": "异常堆栈；manual bug 分析时填写待分析堆栈"
  "Zip": "是否压缩为 .zip"
  "Skill Source URL": "三方 skill 仓库 URL（如 GitHub 仓库地址）"
  "Report Name": "评估报告名（默认 THIRD-PARTY-SKILL-ASSESSMENT-{date}）"
  "Workflow Name": "新工作流名（kebab-case，如 my-process）"
  "Purpose": "工作流目的一句话描述"
  "Next Workflow": "下游工作流名（或留空 = None）"
  "Command Name": "新命令名（kebab-case，如 my-command）"
  "Description": "命令功能的一句话描述"
  "Skill": "所选技能（extensions / global / local 来源）"
  "Task": "让 agent 用该 skill 执行的任务（留空=仅加载并报告就绪）"

option_descriptions:
  Operation:
    search: 梳理检索
    diff: 逻辑对比
    chain: 逻辑链路
    manual: 手动自定义
  Keep Results:
    "yes": 保留到 scans/ 目录
    "no": 仅会话内输出，不写文件
  Mode:
    weekly: 每周巡检
    monthly: 每月巡检
    quarterly: 每季巡检
    on-demand: 按需巡检
    re-entry: L3 变更重入（prepare/spec）
  Zip:
    "yes": 生成 .zip 并删除临时目录
    "no": 仅保留目录
  Base Branch:
    master: 默认基线分支
    main: 主分支
  Knowledge Operation:
    collect: 收集沉淀
    update: 更新已有
    search: 检索
    review: 审核去重
    archive: 归档过时
  Analysis Target:
    structure: 结构分析
    dependency: 依赖分析
    consistency: 一致性校验
    quality: 质量评估
    full: 全量分析
  Analysis Scope:
    ai-system: 系统整体
    workflows: 工作流
    skills: 技能
    governance: 治理
    templates: 模板
    cli: CLI 层

field_actions:
  manual: "type manually"
  skip: "skip"

# 输入字段在 prompt 中的展示标签（prompt_builder 用，key 为 CLI/wizard 内部字段名）
input_labels:
  workspace: "Workspace ID"
  project: "Project ID"
  task: "Task ID"
  change: "Change ID"
  issue: "Issue ID"
  version: "Release Version"
  request: "Change Request"
  code: "Code Reference"
  base: "Base Branch"
  mode: "Mode"
  operation: "Operation"
  projects: "Projects"
  compare: "Compare With"
  keep_results: "Keep Results"
  scan_directory: "Scan Directory"

# 菜单 UI 提示文案（menu.py 用）
menu:
  hint_select: "↑/↓ 选择，输入过滤，Enter 选中，退格返回，Esc 退出"
  hint_filter: "输入过滤，退格清除，Enter 选中，Esc 清空"
  hint_no_match: "(无匹配 — 退格清空过滤)"
  hint_multi: "空格选中/取消，Enter 确认（已选 {n}），退格清除，Esc 清空"
  hint_text: "Enter 提交，Alt+Enter 换行，空行退格返回，Esc/Ctrl+C 退出"
  hint_path: "输入路径，Tab 补齐，Enter 提交，退格返回，Esc/Ctrl+C 退出"
  filter_prefix: "filter"
  fallback_hint_skip: "输入编号 [Enter=跳过, b=返回]"
  fallback_hint_default: "输入编号 [默认 {n}, b=返回]"
  fallback_many: "输入编号（逗号分隔多个），空=跳过全部，b=返回"
  fallback_many_prompt: "选择 (如 1,3): "
  invalid: "无效输入，请重试。"
