version: 1
locale: zh

# ai-system/skills 中需在 aic-skill 菜单暴露的 on-demand 技能（core 源）。
# launcher 默认只扫 extensions/global/local；此处显式登记 core 技能供菜单可达。
# 已登记的技能须在 ai-system/skills/<name>/ 下有 skill.md 或 SKILL.md。
core_skills:
  - deepseek-share-to-md

# skill 分组/组合配置（配置驱动，模式对齐 config/menu.yaml）。
# - 本文件只存结构 + key；用户可见分组标题在 config/i18n/{locale}.yaml 的
#   skill_groups.*。
# - groups 顺序即菜单展示顺序。组合组（type: list）置于前，可快速全选常用组合；
#   已在前组出现的 skill 在后续组去重（不重复显示）。
# - 分组类型：
#   - source: 按 skill 来源分组（extensions / global / local）
#   - list:   显式技能清单组合（如常用热修复组合）；可选 task 字段作为该组合的
#     默认任务模板（选该组合后自动带出）。
# - tasks: 任务预设清单，task 输入前可选（title 为 i18n key 或直接文案）。
# - 未命中任何分组的 skill 自动落入"其他"组（fallback，类似菜单 other）。

# OPTIMIZATION_LOG 约定（extensions 技能统一优化日志）：
# 每个 extension skill 目录内保留 <skill>/OPTIMIZATION_LOG.md，每次实战优化
# 后追加一条记录（顶部为最新），字段：触发场景 / 问题清单与根因 / 改动内容 /
# 验证结果 / 影响评估 / 复现与回归建议。参考示例：
#   extensions/hotfix-test-doc/OPTIMIZATION_LOG.md
# 该日志与 skill 同生命周期随行。

groups:
  - title: skill_group_hotfix
    type: list
    task: "根据提交内容编写转测文档（背景 + 问题原因 + 解决）"
    skills:
      - codeup-submit-mr
      - hotfix-test-doc
  - title: skill_group_core
    type: source
    value: core
  - title: skill_group_company
    type: source
    value: extensions
  - title: skill_group_global
    type: source
    value: global
  - title: skill_group_project
    type: source
    value: local

tasks:
  - title: task_combos
    items:
      - "根据提交内容编写转测文档（背景 + 问题原因 + 解决）"
      - "提交 Codeup MR 并关联变更"
      - "发布 Markdown 到 Confluence"
      - "生成 on-call 周报"
